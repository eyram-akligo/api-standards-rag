services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: api-rag-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragdb
    volumes:
      - pgvector-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-rag-service
    env_file: .env
    environment:
      DB_CONNECTION_STRING: postgresql+psycopg://myuser:${POSTGRES_PASSWORD}@postgres:5432/ragdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvector-data: